name: Build & Release Android APK

on:
  # 1. Запуск вручную по кнопке в GitHub (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Создать официальный релиз на GitHub?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Имя версии/тега (например: v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

  # 2. Запуск, когда вы САМИ создаете релиз через интерфейс GitHub (Releases -> Draft a new release -> Publish)
  release:
    types: [published]

  # 3. Запуск при ручной отправке тега из терминала: git push origin v1.0.0
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Generate Nuxt Web Assets (SPA)
        run: npm run generate

      - name: Add Android Platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/neco-part-storage.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neco-part-storage-apk
          path: build-output/neco-part-storage.apk
          retention-days: 14

      # Прикрепление APK к релизу, если релиз был создан вручную или выбран чекбокс
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release) || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build-output/neco-part-storage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
