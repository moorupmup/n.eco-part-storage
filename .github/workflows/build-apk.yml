name: Build & Release Android APK

on:
  # 1. Запуск вручную по кнопке в GitHub (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Создать официальный релиз на GitHub?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Имя версии/тега (например: v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

  # 2. Запуск, когда вы САМИ создаете релиз через интерфейс GitHub (Releases -> Draft a new release -> Publish)
  release:
    types: [published]

  # 3. Запуск при ручной отправке тега из терминала: git push origin v1.0.0
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Sync App Version from Tag
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          CLEAN_VER=$(echo "$RAW_TAG" | sed 's/^v//')
          if [ -n "$CLEAN_VER" ] && [ "$CLEAN_VER" != "main" ]; then
            echo "Setting build version to $CLEAN_VER"
            npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version || true
          fi

      - name: Generate Nuxt Web Assets (SPA)
        run: npm run generate

      - name: Add Android Platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Inject Version into Android build.gradle
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          CLEAN_VER=$(echo "$RAW_TAG" | sed 's/^v//')
          if [ -n "$CLEAN_VER" ] && [ "$CLEAN_VER" != "main" ]; then
            python3 -c "
            import re
            gradle_path = 'android/app/build.gradle'
            with open(gradle_path, 'r') as f:
                code = f.read()
            code = re.sub(r'versionName\s+[\"\\\'].*?[\"\\\']', f'versionName \"$CLEAN_VER\"', code)
            with open(gradle_path, 'w') as f:
                f.write(code)
            "
          fi

      - name: Apply Custom Portafilter App Icons
        run: |
          cp -r android-res/* android/app/src/main/res/

      - name: Configure Android Permissions for In-App Updates
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              code = f.read()
          
          perm = '<uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />'
          if 'REQUEST_INSTALL_PACKAGES' not in code:
              code = code.replace('</manifest>', f'    {perm}\n</manifest>')
              with open(manifest_path, 'w') as f:
                  f.write(code)
          "

      - name: Configure Permanent Signing Keystore
        run: |
          mkdir -p android/app/keystore
          cp keystore/release.keystore android/app/keystore/release.keystore
          
          # Inject signingConfigs into android/app/build.gradle
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              code = f.read()
          
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file('keystore/release.keystore')
                      storePassword 'necopart2026'
                      keyAlias 'necopart'
                      keyPassword 'necopart2026'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          '''
          if 'signingConfigs {' not in code:
              code = code.replace('buildTypes {', signing_block + '\n    buildTypes {')
              # Ensure debug and release both use our permanent release key
              code = code.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              with open('android/app/build.gradle', 'w') as f:
                  f.write(code)
          "

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Align and Sign APK with Permanent Key
        run: |
          mkdir -p build-output
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          echo "Signing $RAW_APK with permanent release.keystore using $APKSIGNER"
          $APKSIGNER sign --ks keystore/release.keystore \
            --ks-pass pass:necopart2026 \
            --ks-key-alias necopart \
            --key-pass pass:necopart2026 \
            --out build-output/neco-part-storage.apk \
            "$RAW_APK"

          echo "Verifying permanent APK signature:"
          $APKSIGNER verify --verbose build-output/neco-part-storage.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neco-part-storage-apk
          path: build-output/neco-part-storage.apk
          retention-days: 14

      # Прикрепление APK к релизу, если релиз был создан вручную или выбран чекбокс
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release) || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: build-output/neco-part-storage.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
