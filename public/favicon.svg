<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Gear Cog Teeth (Background Gear) -->
  <g stroke="#10b981" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Outer ring of gear -->
    <circle cx="50" cy="45" r="30" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="8 6" />
    <!-- Gear teeth radially around circle (cx: 50, cy: 45, r: 34) -->
    <line x1="50" y1="11" x2="50" y2="16" stroke-width="4" stroke="#10b981" />
    <line x1="74" y1="21" x2="70.5" y2="24.5" stroke-width="4" stroke="#10b981" />
    <line x1="84" y1="45" x2="79" y2="45" stroke-width="4" stroke="#10b981" />
    <line x1="74" y1="69" x2="70.5" y2="65.5" stroke-width="4" stroke="#10b981" />
    <line x1="26" y1="69" x2="29.5" y2="65.5" stroke-width="4" stroke="#10b981" />
    <line x1="16" y1="45" x2="21" y2="45" stroke-width="4" stroke="#10b981" />
    <line x1="26" y1="21" x2="29.5" y2="24.5" stroke-width="4" stroke="#10b981" />
  </g>

  <!-- Portafilter Body & Handle -->
  <!-- Portafilter Handle (pointing down) -->
  <path d="M46 62V82C46 84.2 47.8 86 50 86C52.2 86 54 84.2 54 82V62" fill="#18181b" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="67" x2="50" y2="81" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />

  <!-- Portafilter Ears / Lugs -->
  <rect x="23" y="42" width="7" height="6" rx="2" fill="#27272a" stroke="#10b981" stroke-width="1.8" />
  <rect x="70" y="42" width="7" height="6" rx="2" fill="#27272a" stroke="#10b981" stroke-width="1.8" />

  <!-- Portafilter Head (Outer Rim) -->
  <circle cx="50" cy="45" r="21" fill="#18181b" stroke="#10b981" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Portafilter Basket & Shower Screen (Inner Rim) -->
  <circle cx="50" cy="45" r="14" fill="#09090b" stroke="#34d399" stroke-width="2" />
  <!-- Hex Nut / Center Screw -->
  <polygon points="50,39 55,42 55,48 50,51 45,48 45,42" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" />
  <circle cx="50" cy="45" r="1.5" fill="#ecfdf5" />

  <!-- Shower holes micro-dots -->
  <circle cx="50" cy="35" r="0.8" fill="#34d399" />
  <circle cx="50" cy="55" r="0.8" fill="#34d399" />
  <circle cx="40" cy="45" r="0.8" fill="#34d399" />
  <circle cx="60" cy="45" r="0.8" fill="#34d399" />
</svg>
