<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Gear (Mechanical Side - Right) -->
  <g fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Gear center circle -->
    <circle cx="58" cy="50" r="14" stroke="#34d399" stroke-width="3" stroke-opacity="0.9" />
    <circle cx="58" cy="50" r="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
    <!-- Gear teeth on outer arc -->
    <path d="M58 24v-4M73 28l2.8-2.8M84 41h4M84 59h4M73 72l2.8 2.8M58 76v4" stroke-width="3.5" />
    <circle cx="58" cy="50" r="26" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.6" />
  </g>

  <!-- Coffee Bean (Organic Engineering Side - Left) -->
  <g fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left outer bean contour -->
    <path d="M48 24C32 25 24 35 24 50C24 65 32 75 48 76" fill="#10b981" fill-opacity="0.12" />
    <!-- Central S-curve split of coffee bean -->
    <path d="M48 24C46 34 52 44 48 50C44 56 50 66 48 76" stroke="#34d399" stroke-width="3" />
  </g>

  <!-- Accent glow dot -->
  <circle cx="58" cy="50" r="2" fill="#ecfdf5" />
</svg>
